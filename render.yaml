# Render Blueprint: deploys the Streamlit app as a free web service.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: swim-tracker
    runtime: python
    plan: 0.5c-512mb
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      streamlit run streamlit_app.py
      --server.address 0.0.0.0
      --server.port $PORT
      --server.headless true
      --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: ALLOW_PUBLIC_WRITES
        value: "false"
      - key: AI_DAILY_CALL_LIMIT
        value: "200"
